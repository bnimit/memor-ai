[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memor-cli"
version = "0.12.0"
description = "Local shared memory for coding agents (Claude Code, Cursor, Codex, Copilot, Kimi, Goose) plus opt-in token-savings proxy. Fire and forget — no Memor API key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Nimit Bhandari", email = "nimitbhandari17@gmail.com" },
]
keywords = [
  "memory",
  "agent",
  "ai-agents",
  "ai-memory",
  "claude",
  "claude-code",
  "cursor",
  "codex",
  "copilot",
  "kimi",
  "goose",
  "embeddings",
  "coding-assistant",
  "local-first",
  "rag",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "sqlite-vec>=0.1.6",
  "numpy>=1.26",
  "typer>=0.12",
  "httpx>=0.27",
  "tiktoken>=0.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "model2vec>=0.8",
]

[project.optional-dependencies]
api-embed = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
llm = ["llama-cpp-python>=0.3.0"]
cursor-wire = ["mitmproxy>=10.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/bnimit/memor-ai"
Repository = "https://github.com/bnimit/memor-ai"
Issues = "https://github.com/bnimit/memor-ai/issues"

[project.scripts]
memor = "memor.cli:app"
memor-hook = "memor.hook_cli:main"
memor-retrieve-mcp = "memor.proxy.mcp_retrieve:main"
memor-cursor-compress-hook = "memor.cursor_compress_hook:hook_main"
memor-compress-exec = "memor.cursor_compress_hook:compress_exec_entry"

[tool.setuptools.packages.find]
include = ["memor*"]

[tool.setuptools.package-data]
"memor.dashboard" = ["static/**"]
"memor.eval" = ["proxy_benchmark_fixtures/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
