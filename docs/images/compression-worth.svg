<svg xmlns="http://www.w3.org/2000/svg" width="624" height="344" viewBox="0 0 624 344">
<rect width="624" height="344" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="5" fill="#ff5f57"/>
<circle cx="38" cy="18" r="5" fill="#febc2e"/>
<circle cx="56" cy="18" r="5" fill="#28c840"/>
<text x="76" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#6e7681">memor compression-worth</text>
<text x="18" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#39c5cf" xml:space="preserve">$ memor compression-worth</text>
<text x="18" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">REALIZED SAVINGS: 0.9% of proxied tokens</text>
<text x="18" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  86% of requests carried nothing compressible — coverage,</text>
<text x="18" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  not compressor quality, is what caps this number.</text>
<text x="18" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  Includes 133 hook rows that never went through the proxy;</text>
<text x="18" y="166" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  see HOOK PATH below for what they can and cannot prove.</text>
<text x="18" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">HOOK PATH (tool output crushed before it enters the transcript): 83.7%</text>
<text x="18" y="226" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  133 tool results, 308,584 -&gt; 50,304 tokens</text>
<text x="18" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  No cache risk on this path: the payload is shrunk on the way in,</text>
<text x="18" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  so no already-cached prefix is rewritten.</text>
<text x="18" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  Tokenizer estimate, not a billed measurement: the provider never</text>
<text x="18" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">  saw the uncompressed payload, so no invoice can confirm this.</text>
</svg>